<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title><!-- Google Fonts -->
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="index.js"></script>
</head>

<body>
  <header>
    <h1>Contact Manager</h1>
    <input type="text" id="searchInput" placeholder="Search contacts...">
  </header>
  <section class="form-section">
    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Name" required>
    </div>
    <div class="input-group">
      <input type="tel" id="phoneInput" placeholder="Phone" required>
    </div>
    <div class="input-group">
      <input type="email" id="emailInput" placeholder="Email" required>
    </div>
    <div class="input-group">
      <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/jpg,image/webp">
      <img id="avatarPreview">
    </div>
    <button id="addContactBtn">Add Contact</button>
  </section>
  <section class="contacts" id="contactsContainer"> <!-- CONTACT CARD TEMPLATE -->
  </section>
  <div id="emptyState">
    <p>No contacts yet. Add your first one ✨</p>
  </div>
  <footer>
    <p id="contactCounter">0 Contacts</p>
    <h6>© 2026 T3ZZ4R. All Rights Reserved.</h6>
  </footer><!-- 
STORAGE NOTE:
You can store contacts using localStorage or IndexedDB.
For avatars:
- Convert image to Base64 OR use URL.createObjectURL
- Save as string and re-render inside <img src="">
-->
  <div id="errorToast" class="error-toast">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errorMessage">This is an error message!</span>
  </div>
</body>

</html>
