<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title><!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>Contact Manager</h1>
    <input type="text" id="searchInput" placeholder="Search contacts...">
  </header>
  <section class="form-section">
    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Name">
    </div>
    <div class="input-group">
      <input type="tel" id="phoneInput" placeholder="Phone">
    </div>
    <div class="input-group">
      <input type="email" id="emailInput" placeholder="Email">
    </div>
    <div class="input-group">
      <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/jpg,image/webp">
      <img id="avatarPreview">
    </div>
    <button id="addContactBtn">Add Contact</button>
  </section>
  <section class="contacts" id="contactsContainer"> <!-- CONTACT CARD TEMPLATE --> <!--
  <div class="card">
    <div class="avatar">
      <img src="data:image/...">
      OR
      <div class="avatar-placeholder">A</div>
    </div>
    <h3>Name</h3>
    <p>Phone</p>
    <p>Email</p>
    <div class="actions">
      <button class="edit-btn"><i class="fa fa-pen"></i></button>
      <button class="delete-btn"><i class="fa fa-trash"></i></button>
    </div>
  </div>
  --></section>
  <div id="emptyState">
    <p>No contacts yet. Add your first one ✨</p>
  </div>
  <footer>
    <p id="contactCounter">0 Contacts</p>
  </footer><!-- 
STORAGE NOTE:
You can store contacts using localStorage or IndexedDB.
For avatars:
- Convert image to Base64 OR use URL.createObjectURL
- Save as string and re-render inside <img src="">
-->
</body>

</html>
